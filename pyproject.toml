[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-transparent-waf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mitmproxy>=11,<13", "PyYAML>=6,<7"]

[tool.setuptools]
packages = ["aegis"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
ml = ["numpy>=1.26,<3", "onnxruntime>=1.17,<2", "tokenizers>=0.20,<1", "transformers>=4.45,<6"]
