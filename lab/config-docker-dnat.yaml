proxy:
  listen_host: 0.0.0.0
  listen_port: 18080
discovery:
  docker_published_ports: false
  interval_seconds: 2
  probe_timeout_seconds: 0.5
  excluded_ports: [22, 2222, 443, 8443, 5432, 3306, 6379, 27017, 18080]
  include_ports: [15000]
nftables:
  table: aegis
  family: inet
detector:
  mode: allow-all
